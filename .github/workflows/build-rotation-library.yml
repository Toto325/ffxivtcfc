# 產生／更新「手法庫」（data/craft-rotation-library.json）。這是離線的靜態資料，網站只讀取它。
#
# 使用方式（只有一個選項）：
#   GitHub → Actions → build-rotation-library → Run workflow → 選「模式」→ Run
#
#   快速測試  約 10～20 分鐘。每個分片只做 1 個形狀，確認整個流程（產生、合併、存回）沒問題。第一次請先跑這個。
#   高等級    90 級以上（201 種形狀）。每個分片最多跑 5 小時 20 分，沒跑完的下次再跑會接著做。
#   低等級    90 級以下（446 種形狀）。同上。
#
# 跑完會自動把結果存回 data/craft-rotation-library.json（已經做好的形狀不會被覆蓋、會累積）。
name: build-rotation-library
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '模式'
        type: choice
        default: 快速測試
        options:
          - 快速測試
          - 高等級
          - 低等級
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 產生這個分片的手法庫
        run: |
          mkdir -p out
          case "${{ inputs.mode }}" in
            "高等級") ARGS="--min-rlvl 580 --budget 8000 --beam-budget 40000000 --beam-widths 4000,12000,30000 --max-minutes 320" ;;
            "低等級") ARGS="--min-rlvl 0 --max-rlvl 579 --budget 3000 --beam-budget 15000000 --beam-widths 3000,8000 --max-minutes 320" ;;
            *)        ARGS="--min-rlvl 580 --budget 1500 --beam-budget 6000000 --beam-widths 2500,6000 --limit 1" ;;
          esac
          echo "參數：$ARGS"
          node tools/build-rotation-library.js $ARGS --shard ${{ matrix.shard }}/8 --out out/lib-${{ matrix.shard }}.json
      - name: 上傳這個分片的結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.shard }}
          path: out/lib-${{ matrix.shard }}.json
          if-no-files-found: ignore
  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: 合併並存回
        run: |
          FILES=$(find shards -name '*.json')
          if [ -z "$FILES" ]; then echo "沒有任何分片產生結果"; exit 1; fi
          node tools/build-rotation-library.js --merge $FILES --out data/craft-rotation-library.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/craft-rotation-library.json
          git commit -m "update rotation library" || echo "沒有變更"
          git push
