name: Fetch Fashion Post

on:
  schedule:
    # 每天 UTC 04:00 / 16:00 執行（台灣時間 12:00 / 00:00）
    # cron 是 UTC 時間，可依需求調整頻率
    - cron: '0 4,16 * * *'
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動按「Run workflow」立即執行

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/fetch_fashion.py

      - name: Commit updated data if changed
        run: |
          git config user.name "fashion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fashion.json
          if git diff --cached --quiet; then
            echo "沒有變化，不用 commit"
          else
            git commit -m "自動更新時尚品鑑資料 [skip ci]"
            git push
          fi
