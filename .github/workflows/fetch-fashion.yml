name: Fetch Fashion Post

on:
  schedule:
    # 每 3 小時執行一次（UTC 0,3,6,9,12,15,18,21 點）
    # cron 是 UTC 時間，換算台灣時間會是每 3 小時的整點（08:00, 11:00, 14:00...以此類推，UTC+8）
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動按「Run workflow」立即執行

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/fetch_fashion.py

      - name: Commit updated data if changed
        run: |
          git config user.name "fashion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fashion.json
          if git diff --cached --quiet; then
            echo "沒有變化，不用 commit"
          else
            git commit -m "自動更新時尚品鑑資料 [skip ci]"
            git push
          fi
